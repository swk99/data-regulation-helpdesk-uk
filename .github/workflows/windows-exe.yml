name: Build Windows executable
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['backend/**', 'packaging/**', 'frontend/local-ui.zip', '.github/workflows/windows-exe.yml']
permissions:
  contents: read
concurrency:
  group: windows-exe
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt pyinstaller==6.22.3
      - run: python -m pytest backend/tests -q
        env:
          PYTHONPATH: backend
      - run: pyinstaller --clean --noconfirm packaging/windows.spec
      - name: Test the packaged executable (no Ollama required)
        run: |
          & .\dist\RegulationHelpdesk.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Executable self-test failed' }
      - name: Write checksum
        run: |
          $hash = (Get-FileHash dist/RegulationHelpdesk.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  RegulationHelpdesk.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: |
            dist/RegulationHelpdesk.exe
            dist/SHA256SUMS.txt
          retention-days: 14
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-executable
          path: dist
      - name: Publish executable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: windows-${{ github.run_number }}-${{ github.run_attempt }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          cat > release-notes.txt <<'EOF'
          Download RegulationHelpdesk.exe and run it on Windows x64. Python is bundled. Keep the app open; it opens and pairs the GitHub Pages chat automatically. Allow local device access if Chrome or Edge asks.

          Ollama must be installed; existing qwen3.5:4b is reused when available. Missing models download on first launch. Documents and model inference stay on your PC. The executable is unsigned; verify this repository and SHA256SUMS.txt before running. Managed devices may require IT approval.

          The packaged executable passed an offline startup, authentication and persistent vector storage self-test on Windows. This does not validate a particular PC's Ollama model or regulatory-answer quality.
          EOF
          gh release create "$RELEASE_TAG" dist/RegulationHelpdesk.exe dist/SHA256SUMS.txt --target "$RELEASE_COMMIT" --title 'Windows app — GitHub Pages + your PC' --notes-file release-notes.txt --latest
